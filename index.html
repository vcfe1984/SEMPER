<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>時辰頌禱</title>
<meta name="theme-color" content="#7a1c1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <button id="prev" class="ic" aria-label="前一天">‹</button>
    <label class="datebtn"><span id="dateLabel"></span><input id="datePick" type="date" aria-label="選擇日期"></label>
    <button id="next" class="ic" aria-label="後一天">›</button>
    <button id="today" class="txt">今天</button>
    <button id="menuBtn" class="ic" aria-label="設定">⚙</button>
  </div>
  <nav id="hours" class="hours"></nav>
</header>
<div id="celebs" class="celebs"></div>
<main id="office" class="office" aria-live="polite"><p class="loading">載入中…</p></main>
<div id="settings" class="sheet" hidden>
  <div class="sheet-in">
    <h2>設定</h2>
    <div class="row"><span>字體大小</span><button data-fs="-1" class="pill">A−</button><button data-fs="1" class="pill">A＋</button></div>
    <div class="row"><span>外觀</span><button data-theme="light" class="pill">日間</button><button data-theme="sepia" class="pill">米黃</button><button data-theme="dark" class="pill">夜間</button></div>
    <label class="row"><input type="checkbox" id="marks"> 顯示誦唱記號（※ * †）</label>
    <label class="row"><input type="checkbox" id="rubrics" checked> 顯示說明及經文來源</label>
    <p class="about">經文取自香港教區禮儀委員會「每日日課」（catholic-dlc.org.hk），原譯出自台灣地區主教團禮儀委員會《每日頌禱》及《每日禮讚》。自由紀念之集禱經取自禮儀委員會《平日彌撒》聖人專用部分；其餘取自相關通用部分。僅供私人及團體祈禱之用。</p>
    <p class="about" id="coverage"></p>
    <button id="closeSettings" class="pill wide">完成</button>
  </div>
</div>
<div id="update" class="update" hidden><button id="updateBtn">有新版本 — 按此更新</button></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
